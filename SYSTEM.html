                const decodedHTML = new TextDecoder().decode(bytes);

                // Render total ke dokumen
                document.open();
                document.write(decodedHTML);
                document.close();
            } catch (err) {
                document.body.innerHTML = "<h2 style='color:red; text-align:center; margin-top:20vh;'>Gagal memuat sistem keamanan!</h2>";
            }
        })();
    </script>
</body>
</html>
