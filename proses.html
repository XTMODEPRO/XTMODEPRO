<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTMODE - SECURE VERIFICATION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        
        :root {
            --bg-main: #09090b;
            --card-bg: rgba(24, 24, 27, 0.85);
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.5);
            --success: #10b981;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-muted: #a1a1aa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body { 
            background: radial-gradient(circle at top, #1e1b4b, var(--bg-main) 80%);
            color: var(--text); 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden; 
        }

        .container { 
            background: var(--card-bg); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 30px 25px; 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.1); 
            width: 100%;
            max-width: 420px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px var(--primary-glow); 
            text-align: center;
        }

        h3 { color: var(--text); font-size: 20px; margin-bottom: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        p.subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

        .loading { color: var(--primary); font-weight: 600; }
        .error-message, .invalid-link { display: none; color: var(--danger); }

        /* Style Grid Pilih Gambar Anti-Robot */
        .captcha-grid-container {
            background: #18181b;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .captcha-instruction {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
            background: rgba(139, 92, 246, 0.15);
            padding: 8px;
            border-radius: 8px;
            border: 1px dashed var(--primary);
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .captcha-img-card {
            background: #27272a;
            border-radius: 10px;
            height: 95px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            font-size: 32px;
            user-select: none;
        }
        .captcha-img-card span {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 600;
        }
        .captcha-img-card:hover {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.1);
        }
        .captcha-img-card.selected {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.2);
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 15px;
            cursor: pointer;
            border: none;
            background: linear-gradient(135deg, var(--primary), #6d28d9);
            color: white;
            font-weight: 800;
            border-radius: 12px;
            font-size: 15px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px var(--primary-glow);
            transition: all 0.3s ease;
        }
        button:active { transform: scale(0.96); }

        .adblock-modal-style { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.98); z-index: 999999; 
            display: flex; justify-content: center; align-items: center; 
            flex-direction: column; text-align: center; padding: 20px; 
            backdrop-filter: blur(15px); color: white; 
        }
        .adblock-modal-style h1 { color: var(--danger); font-size: 30px; margin-bottom: 10px; font-weight: 800; }
        .adblock-modal-style p { color: #fff; font-size: 15px; max-width: 450px; line-height: 1.6; }
        .icon-alert { font-size: 60px; margin-bottom: 15px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }

        .adsbox { position: absolute; left: -999px; height: 1px; width: 1px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Tampilan Loading Awal -->
    <div id="status" class="loading">
        <h3>Memeriksa Keamanan Sistem...</h3>
        <p class="subtitle">Mohon tunggu sebentar, memvalidasi enkripsi.</p>
    </div>

    <!-- Tampilan Sistem Pilih Gambar (Anti-Robot) -->
    <div id="captcha-container" style="display: none;">
        <h3>Verifikasi Anti-Robot</h3>
        <p class="subtitle">Selesaikan verifikasi untuk melanjutkan.</p>
        
        <div class="captcha-grid-container">
            <div class="captcha-instruction" id="instruction-text">Pilih gambar: <b>...</b></div>
            <div class="image-grid" id="image-grid-box">
                <!-- Grid gambar dirender via JavaScript -->
            </div>
        </div>
        <button id="verify-btn" onclick="validateCaptcha()" style="opacity: 0.5; pointer-events: none;">VERIFIKASI & LANJUTKAN</button>
    </div>
    
    <!-- Tampilan Pesan Error Link Tidak Valid -->
    <div id="invalid-msg" class="invalid-link">
        <h3>Link Tidak Valid!</h3>
        <p class="subtitle">URL tujuan tidak ditemukan atau parameter hash rusak.</p>
    </div>
</div>

<!-- Script Iklan Pemicu Deteksi -->
<script src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>

<script>
    const _0x5a1f = ["\x58\x54", "\x4d\x4f", "\x44\x45", "\x53\x45", "\x43\x52", "\x45\x54"];
    const secretKey = _0x5a1f.join(''); 

    function decodeURL(encodedData) {
        try {
            let decodedBase64 = atob(encodedData);
            let result = "";
            for (let i = 0; i < decodedBase64.length; i++) {
                result += String.fromCharCode(decodedBase64.charCodeAt(i) ^ secretKey.charCodeAt(i % secretKey.length));
            }
            return result;
        } catch (e) {
            return null;
        }
    }

    const hashData = window.location.hash.substring(1);
    const targetUrl = decodeURL(hashData);

    // Validasi awal Hash URL
    if (!targetUrl || !targetUrl.startsWith("http")) {
        document.getElementById('status').style.display = 'none';
        document.getElementById('invalid-msg').style.display = 'block';
        throw new Error("Invalid Link Detected");
    }

    // --- GOD MODE SISTEM DETEKSI ADBLOCK ---
    (function() {
        const MODAL_ID = 'secure-adblock-trap';
        let adblockHasBeenDetected = false;

        function enforceLock(reason) {
            let modal = document.getElementById(MODAL_ID);
            if (!modal) {
                modal = document.createElement('div');
                modal.id = MODAL_ID;
                modal.className = 'adblock-modal-style';
                modal.innerHTML = `
                    <div class="icon-alert">🛑</div>
                    <h1>AKSES DIBLOKIR</h1>
                    <p id="adblock-msg-text"></p>
                `;
                document.body.appendChild(modal);
            }
            document.body.style.overflow = 'hidden';
            adblockHasBeenDetected = true; 

            const msgBox = document.getElementById('adblock-msg-text');
            if (msgBox) {
                if (reason === 'offline') {
                    msgBox.innerHTML = "<b>Koneksi Internet Terputus!</b><br><br>Harap nyalakan kembali koneksi Anda.";
                } else {
                    msgBox.innerHTML = "Sistem mendeteksi penggunaan Adblocker atau Private DNS.<br><br><b>Mohon matikan pemblokir iklan Anda. Halaman ini akan memuat ulang otomatis jika iklan diizinkan.</b>";
                }
            }
        }

        function runSecurityCheck() {
            if (!navigator.onLine) {
                enforceLock('offline');
                return;
            }

            let isBlocked = false;
            let bait = document.createElement('div');
            bait.innerHTML = '&nbsp;';
            bait.className = 'adsbox adsbygoogle';
            document.body.appendChild(bait);

            if (bait.offsetHeight === 0 || window.getComputedStyle(bait).display === 'none') {
                isBlocked = true;
            }
            bait.remove();

            const rand = new Date().getTime() + Math.random();
            const p1 = fetch('https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?nocache=' + rand, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' });

            if (isBlocked) {
                enforceLock('adblock');
            } else {
                p1.then(() => {
                    if (adblockHasBeenDetected) {
                        window.location.reload(true); 
                    }
                }).catch(() => enforceLock('adblock'));
            }
        }

        window.addEventListener('load', function() {
            setTimeout(function() {
                runSecurityCheck();
                if (!document.getElementById(MODAL_ID)) {
                    document.getElementById('status').style.display = 'none';
                    document.getElementById('captcha-container').style.display = 'block';
                    initCaptchaGame();
                }
            }, 1200);
        });

        setInterval(runSecurityCheck, 3000);
    })();


    // --- LOGIKA SISTEM ANTI-ROBOT PILIH GAMBAR ---
    const captchaItems = [
        { name: "Mobil", emoji: "🚗" },
        { name: "Kucing", emoji: "🐱" },
        { name: "Kopi", emoji: "☕" },
        { name: "Sepatu", emoji: "👟" },
        { name: "Pohon", emoji: "🌲" },
        { name: "Jam", emoji: "⏰" }
    ];

    let targetCategory = "";
    let selectedCardIndex = null;
    let correctIndex = null;

    function initCaptchaGame() {
        const randomTarget = captchaItems[Math.floor(Math.random() * captchaItems.length)];
        targetCategory = randomTarget.name;
        document.getElementById('instruction-text').innerHTML = `Pilih gambar: <b>${targetCategory}</b>`;

        let pool = [...captchaItems];
        let correctItem = randomTarget;
        
        let wrongItems = pool.filter(item => item.name !== targetCategory);
        wrongItems.sort(() => Math.random() - 0.5);
        
        let currentChoices = [correctItem, wrongItems[0], wrongItems[1], wrongItems[2]];
        currentChoices.sort(() => Math.random() - 0.5);

        correctIndex = currentChoices.findIndex(item => item.name === targetCategory);

        let gridBox = document.getElementById('image-grid-box');
        gridBox.innerHTML = "";

        currentChoices.forEach((item, index) => {
            let card = document.createElement('div');
            card.className = "captcha-img-card";
            card.innerHTML = `${item.emoji}<span>${item.name}</span>`;
            card.onclick = function() {
                document.querySelectorAll('.captcha-img-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedCardIndex = index;

                let btn = document.getElementById('verify-btn');
                btn.style.opacity = "1";
                btn.style.pointerEvents = "auto";
            };
            gridBox.appendChild(card);
        });
    }

    function validateCaptcha() {
        if (selectedCardIndex === correctIndex) {
            window.location.href = targetUrl;
        } else {
            alert("Pilihan salah! Silakan coba lagi.");
            selectedCardIndex = null;
            let btn = document.getElementById('verify-btn');
            btn.style.opacity = "0.5";
            btn.style.pointerEvents = "none";
            initCaptchaGame();
        }
    }
</script>

</body>
</html>
