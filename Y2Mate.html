<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTMODEPRO AD BLOCK</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #121212;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <iframe 
            id="sandboxFrame" 
            src="https://www.y2mate.in.net/convert/" 
            sandbox="allow-scripts allow-same-origin allow-forms allow-downloads">
        </iframe>
    </div>

    <script>
        const iframe = document.getElementById('sandboxFrame');

        // Daftar selektor untuk membersihkan iklan
        const adSelectors = [
            'iframe[src*="ads"]',
            'iframe[src*="doubleclick"]',
            'iframe[src*="googlesyndication"]',
            'div[class*="ads"]',
            'div[id*="ads"]',
            'ins.adsbygoogle',
            'script[src*="ads"]',
            'a[href*="ads"]',
            '.advertisement',
            '#advertisement'
        ];

        function cleanAds() {
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                if (!iframeDoc) return;

                // Suntikkan CSS pemblokir iklan
                if (!iframeDoc.getElementById('anti-ad-css')) {
                    const styleEl = iframeDoc.createElement('style');
                    styleEl.id = 'anti-ad-css';
                    styleEl.innerHTML = `
                        iframe[src*="ads"], .adsbygoogle, [id*="google_ads"], 
                        [class*="banner-ads"], div[style*="z-index: 2147483647"] {
                            display: none !important;
                            visibility: hidden !important;
                            opacity: 0 !important;
                            pointer-events: none !important;
                            max-height: 0px !important;
                        }
                    `;
                    iframeDoc.head.appendChild(styleEl);
                }

                // Hapus elemen iklan
                adSelectors.forEach(selector => {
                    const elements = iframeDoc.querySelectorAll(selector);
                    elements.forEach(el => el.remove());
                });

                // Blokir script pop-up/redirect mencurigakan
                const scripts = iframeDoc.getElementsByTagName('script');
                for (let s of scripts) {
                    const src = s.src.toLowerCase();
                    if (src.includes('pop') || src.includes('click') || src.includes('track') || src.includes('histats')) {
                        s.remove();
                    }
                }

            } catch (e) {
                // Menangani batasan CORS lintas-asal
            }
        }

        iframe.addEventListener('load', () => {
            setInterval(cleanAds, 1000);

            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                const observer = new MutationObserver(() => {
                    cleanAds();
                });
                observer.observe(iframeDoc.body, { childList: true, subtree: true });
            } catch (e) {
                // Fallback jika observer terhalang batasan ketat
            }
        });
    </script>
</body>
</html>
